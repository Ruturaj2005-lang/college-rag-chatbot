version: '3.8'

services:
  # MongoDB Local Database (Optional - you can also connect to MongoDB Atlas)
  mongodb:
    image: mongo:7.0
    container_name: college_rag_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=college_rag_db

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: college_rag_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - DATABASE_NAME=college_rag_db
      - AI_PROVIDER=mock
      - CHUNK_SIZE=800
      - CHUNK_OVERLAP=120
      - TOP_K=5
      - SIMILARITY_THRESHOLD=0.70
    depends_on:
      - mongodb
    volumes:
      - ./backend/uploads:/app/uploads

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: college_rag_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
