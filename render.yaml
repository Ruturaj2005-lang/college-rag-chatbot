services:
  - type: web
    name: college-rag-chatbot-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.1
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: college_rag_db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: mock
      - key: SIMILARITY_THRESHOLD
        value: "0.70"
      - key: TOP_K
        value: "5"
      - key: UPLOAD_DIR
        value: uploads
